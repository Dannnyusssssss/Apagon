name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions by default; the deploy job asks only for what Pages needs.
permissions:
  contents: read

# One deployment at a time; a newer push does not cancel one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Auditoría (falla con vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
